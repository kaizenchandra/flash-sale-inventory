apiVersion: apps/v1
kind: Deployment
metadata: { name: flashsale }
spec:
  replicas: 3
  selector: { matchLabels: { app: flashsale } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: flashsale } }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: app
          image: flashsale:1.0.0
          ports: [ { containerPort: 8080 } ]
          resources:
            requests: { cpu: '1', memory: 768Mi }
            limits: { cpu: '2', memory: 1536Mi }
          envFrom:
            - configMapRef: { name: flashsale }
            - secretRef: { name: flashsale-runtime }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 10 }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, failureThreshold: 60, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
          volumeMounts: [ { name: tmp, mountPath: /tmp } ]
      volumes: [ { name: tmp, emptyDir: { sizeLimit: 64Mi } } ]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: flashsale } }
---
apiVersion: v1
kind: Service
metadata: { name: flashsale }
spec:
  selector: { app: flashsale }
  ports: [ { port: 80, targetPort: 8080 } ]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: flashsale }
data:
  DB_URL: jdbc:postgresql://postgres.internal:5432/flashsale?sslmode=verify-full
  REDIS_HOST: redis.internal
  SPRING_DATA_REDIS_SSL_ENABLED: 'true'
  KAFKA_SERVERS: kafka.internal:9093
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
  OIDC_ISSUER: https://identity.example.invalid/
  OIDC_AUDIENCE: flashsale
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: flashsale }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: flashsale }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: flashsale }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: flashsale } }
