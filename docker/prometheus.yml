global:
  scrape_interval: 10s
rule_files: [ /etc/prometheus/alerts.yml ]
scrape_configs:
  - job_name: flashsale
    metrics_path: /actuator/prometheus
    scheme: https
    static_configs:
      - targets: [ flashsale.example.invalid ]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
